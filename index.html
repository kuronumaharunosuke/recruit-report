<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2627term Spring Recruitment FR | AIESEC Japan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&family=Noto+Sans+JP:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --aiesec-blue: #037EF3;
    --aiesec-blue-dark: #0263c2;
    --aiesec-blue-light: #e6f2fe;
    --aiesec-yellow: #FFC845;
    --aiesec-orange: #F48924;
    --aiesec-red: #F85A40;
    --aiesec-green: #00C16E;
    --aiesec-cyan: #0CB9C1;
    --aiesec-purple: #7552CC;
    --aiesec-white: #F3F4F7;
    --aiesec-gray: #CACCD1;
    --aiesec-black: #52565E;
    --aiesec-gray-light: #E8EAEE;
    --aiesec-gray-bg: #FAFBFC;

    --font-jp: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-en: 'Lato', sans-serif;
    --font-mono: 'JetBrains Mono', 'SF Mono', Consolas, monospace;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: var(--font-jp);
    color: var(--aiesec-black);
    background: var(--aiesec-gray-bg);
    font-size: 14px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; cursor: pointer; }
  input, textarea, select { font-family: inherit; color: inherit; }

  /* Layout */
  .app {
    display: grid;
    grid-template-rows: 56px 1fr;
    grid-template-columns: 260px 1fr;
    grid-template-areas: "header header" "sidebar main";
    height: 100vh;
    overflow: hidden;
  }

  /* Header */
  .header {
    grid-area: header;
    background: #fff;
    border-bottom: 1px solid var(--aiesec-gray-light);
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 16px;
    z-index: 10;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--font-en);
    font-weight: 900;
    font-size: 16px;
    color: var(--aiesec-black);
  }
  .brand-mark {
    width: 28px; height: 28px;
    background: var(--aiesec-blue);
    display: grid; place-items: center;
    border-radius: 2px;
  }
  .brand-mark img { width: 22px; height: 22px; display: block; }
  .brand-title {
    display: flex; flex-direction: column; line-height: 1.2;
  }
  .brand-title .t1 { font-weight: 900; font-size: 14px; }
  .brand-title .t2 {
    font-family: var(--font-jp);
    font-size: 10px;
    font-weight: 500;
    color: var(--aiesec-gray);
    letter-spacing: 0.05em;
  }
  .header-spacer { flex: 1; }

  .lc-selector {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--aiesec-gray-bg);
    padding: 6px 10px;
    border-radius: 5px;
    border: 1px solid var(--aiesec-gray-light);
  }
  .lc-selector label {
    font-family: var(--font-en);
    font-size: 10px;
    font-weight: 900;
    letter-spacing: 0.08em;
    color: var(--aiesec-gray);
    margin: 0;
    text-transform: uppercase;
  }
  .lc-selector select {
    border: none;
    background: transparent;
    font-weight: 700;
    font-size: 13px;
    padding: 2px 4px;
    min-width: 70px;
    font-family: var(--font-en);
  }
  .lc-selector select:focus { outline: none; box-shadow: none; }

  .term-pill {
    background: var(--aiesec-blue);
    color: #fff;
    padding: 5px 10px;
    border-radius: 4px;
    font-family: var(--font-en);
    font-weight: 900;
    font-size: 12px;
    letter-spacing: 0.05em;
  }

  .save-indicator {
    font-size: 11px;
    color: var(--aiesec-gray);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .save-indicator::before {
    content: ''; width: 6px; height: 6px; border-radius: 50%;
    background: var(--aiesec-green);
  }
  .save-indicator.saving::before { background: var(--aiesec-yellow); }

  .btn {
    padding: 7px 14px;
    border-radius: 5px;
    font-size: 12px;
    font-weight: 600;
    border: 1px solid var(--aiesec-gray-light);
    background: #fff;
    color: var(--aiesec-black);
    transition: all 0.12s;
  }
  .btn:hover { border-color: var(--aiesec-blue); color: var(--aiesec-blue); }
  .btn.primary {
    background: var(--aiesec-blue);
    color: #fff;
    border-color: var(--aiesec-blue);
  }
  .btn.primary:hover { background: var(--aiesec-blue-dark); border-color: var(--aiesec-blue-dark); color: #fff; }
  .btn.danger { color: var(--aiesec-red); }
  .btn.danger:hover { border-color: var(--aiesec-red); }
  .btn.sm { padding: 5px 10px; font-size: 11px; }

  /* Checklist button (completion tracker) */
  .checklist-btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    opacity: 0.65;
  }
  .checklist-btn .dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    border: 1.5px solid var(--aiesec-gray);
    background: transparent;
    flex-shrink: 0;
  }
  .checklist-btn.done {
    background: #e0f7ec;
    color: var(--aiesec-green);
    border-color: #a8e5c5;
    opacity: 1;
  }
  .checklist-btn.done .dot {
    background: var(--aiesec-green);
    border-color: var(--aiesec-green);
  }

  /* Sidebar */
  .sidebar {
    grid-area: sidebar;
    background: var(--aiesec-white);
    border-right: 1px solid var(--aiesec-gray-light);
    overflow-y: auto;
    padding: 12px 0 60px;
  }
  .nav-group { margin-bottom: 4px; }
  .nav-group-title {
    font-family: var(--font-en);
    font-size: 10px;
    font-weight: 900;
    letter-spacing: 0.12em;
    color: var(--aiesec-gray);
    padding: 14px 20px 6px;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .nav-group-title::before {
    content: '';
    width: 14px;
    height: 2px;
    background: var(--aiesec-gray);
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 20px;
    cursor: pointer;
    font-size: 12.5px;
    color: var(--aiesec-black);
    border-left: 3px solid transparent;
    transition: all 0.1s;
  }
  .nav-item:hover { background: var(--aiesec-gray-light); }
  .nav-item.active {
    background: #fff;
    border-left-color: var(--aiesec-blue);
    color: var(--aiesec-blue);
    font-weight: 600;
  }
  .nav-num {
    font-family: var(--font-en);
    font-size: 10px;
    font-weight: 700;
    color: var(--aiesec-gray);
    min-width: 22px;
  }
  .nav-item.active .nav-num { color: var(--aiesec-blue); }
  .nav-item .badge-new {
    background: var(--aiesec-yellow);
    color: var(--aiesec-black);
    font-family: var(--font-en);
    font-size: 9px;
    font-weight: 900;
    letter-spacing: 0.05em;
    padding: 1px 5px;
    border-radius: 2px;
    margin-left: auto;
  }

  /* Main */
  .main {
    grid-area: main;
    overflow-y: auto;
    padding: 28px 40px 80px;
  }
  .main-inner { max-width: 1100px; margin: 0 auto; }

  .page-head {
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 2px solid var(--aiesec-black);
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 24px;
  }
  .page-head-content { flex: 1; min-width: 0; }
  .page-head .crumbs {
    font-family: var(--font-en);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: var(--aiesec-gray);
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .page-head h1 {
    margin: 0;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .page-head .desc {
    margin-top: 6px;
    font-size: 13px;
    color: #74787e;
    max-width: 760px;
  }
  .page-save-btn {
    min-width: 100px;
    transition: all 0.2s;
  }
  .page-save-btn.saved {
    background: var(--aiesec-green) !important;
    border-color: var(--aiesec-green) !important;
    color: #fff !important;
  }
  .page-save-btn .kbd {
    font-family: var(--font-mono);
    font-size: 10px;
    opacity: 0.7;
    margin-left: 6px;
    padding: 1px 5px;
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 2px;
  }

  /* Per-card save button (auto-injected into every .card-head) */
  .card-save-btn {
    margin-left: auto;
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 11px;
    font-size: 11px;
    font-weight: 700;
    border: 1px solid var(--aiesec-blue);
    background: var(--aiesec-blue);
    color: #fff;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .card-save-btn::before {
    content: '';
    width: 6px; height: 6px;
    border-radius: 50%;
    background: rgba(255,255,255,0.85);
  }
  .card-save-btn:hover {
    background: var(--aiesec-blue-dark);
    border-color: var(--aiesec-blue-dark);
  }
  .card-save-btn.saved {
    background: var(--aiesec-green);
    border-color: var(--aiesec-green);
  }
  .card-save-btn:disabled { cursor: default; }
  /* When card-head has an existing action button, keep save btn after it */
  .card-head .btn + .card-save-btn { margin-left: 8px; }
  @media (max-width: 767px) {
    .card-save-btn { padding: 4px 9px; font-size: 10px; }
    .card-save-btn::before { width: 5px; height: 5px; }
  }

  /* Reference Panel - per-tab */
  .ref-panel {
    background: linear-gradient(135deg, #fffaeb 0%, #fff5d8 100%);
    border: 1px solid #f0d780;
    border-left: 4px solid var(--aiesec-yellow);
    border-radius: 5px;
    padding: 12px 16px;
    margin-bottom: 20px;
    display: flex;
    gap: 14px;
    align-items: flex-start;
  }
  .ref-panel-icon {
    flex-shrink: 0;
    width: 36px; height: 22px;
    background: var(--aiesec-yellow);
    border-radius: 3px;
    display: grid; place-items: center;
    color: var(--aiesec-black);
    font-weight: 900;
    font-family: var(--font-en);
    font-size: 10px;
    letter-spacing: 0.1em;
    margin-top: 3px;
  }
  .ref-panel-content { flex: 1; min-width: 0; }
  .ref-panel-title {
    font-size: 11px;
    font-weight: 700;
    color: var(--aiesec-black);
    letter-spacing: 0.05em;
    margin-bottom: 4px;
    font-family: var(--font-en);
    text-transform: uppercase;
  }
  .ref-panel-title::after {
    content: ' / このタブで参照する資料';
    font-family: var(--font-jp);
    font-size: 10px;
    color: var(--aiesec-gray);
    font-weight: 500;
    text-transform: none;
    margin-left: 4px;
  }
  .ref-links {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .ref-link {
    background: #fff;
    border: 1px solid #e8d899;
    padding: 4px 10px;
    border-radius: 3px;
    font-size: 11.5px;
    font-weight: 500;
    color: var(--aiesec-black);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    transition: all 0.12s;
  }
  .ref-link:hover {
    border-color: var(--aiesec-blue);
    color: var(--aiesec-blue);
    background: var(--aiesec-blue-light);
  }
  .ref-link.no-url {
    color: var(--aiesec-gray);
    cursor: default;
    border-style: dashed;
  }
  .ref-link.no-url::after {
    content: '未登録';
    font-size: 9px;
    color: var(--aiesec-orange);
    background: #fff3e0;
    padding: 1px 5px;
    border-radius: 3px;
    margin-left: 4px;
    font-weight: 700;
  }
  .ref-link.no-url:hover {
    border-color: #e8d899;
    color: var(--aiesec-gray);
    background: #fff;
  }
  .ref-panel-hint {
    font-size: 10.5px;
    color: var(--aiesec-gray);
    margin-top: 6px;
  }

  /* Cards */
  .card {
    background: #fff;
    border: 1px solid var(--aiesec-gray-light);
    border-radius: 5px;
    margin-bottom: 16px;
    overflow: hidden;
  }
  .card-head {
    padding: 12px 18px;
    border-bottom: 1px solid var(--aiesec-gray-light);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .card-head h2 {
    margin: 0;
    font-size: 14px;
    font-weight: 700;
  }
  .card-head .sub {
    font-size: 10.5px;
    color: var(--aiesec-gray);
    font-family: var(--font-en);
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .card-body { padding: 18px; }

  /* Form */
  .field { margin-bottom: 14px; }
  .field:last-child { margin-bottom: 0; }
  .field-row { display: grid; gap: 14px; margin-bottom: 14px; }
  .field-row.cols-2 { grid-template-columns: 1fr 1fr; }
  .field-row.cols-3 { grid-template-columns: 1fr 1fr 1fr; }
  .field-row.cols-4 { grid-template-columns: 1fr 1fr 1fr 1fr; }

  label {
    display: block;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--aiesec-black);
    margin-bottom: 4px;
  }
  label .hint {
    font-weight: 400;
    color: var(--aiesec-gray);
    margin-left: 6px;
    font-size: 10.5px;
  }
  label .required {
    color: var(--aiesec-red);
    margin-left: 4px;
    font-weight: 700;
  }

  input[type="text"], input[type="number"], input[type="date"], input[type="url"], textarea, select {
    width: 100%;
    padding: 7px 9px;
    border: 1px solid var(--aiesec-gray-light);
    border-radius: 4px;
    font-size: 12.5px;
    background: #fff;
    transition: border-color 0.1s, box-shadow 0.1s;
  }
  input:focus, textarea:focus, select:focus {
    outline: none;
    border-color: var(--aiesec-blue);
    box-shadow: 0 0 0 3px rgba(3, 126, 243, 0.12);
  }
  textarea {
    min-height: 70px;
    resize: vertical;
    font-family: inherit;
    line-height: 1.55;
  }
  textarea.tall { min-height: 110px; }
  textarea.gkm {
    background-image: linear-gradient(to bottom, transparent 0, transparent 100%);
    font-size: 12.5px;
  }
  input[readonly], textarea[readonly] {
    background: var(--aiesec-gray-bg);
    color: var(--aiesec-gray);
    cursor: not-allowed;
  }

  /* KPI Grid (Customer Flow) */
  .kpi-flow {
    overflow-x: auto;
    margin: -4px;
    padding: 4px;
  }
  .kpi-flow-inner {
    display: flex;
    align-items: stretch;
    gap: 0;
    min-width: max-content;
  }
  .kpi-step {
    background: #fff;
    border: 1px solid var(--aiesec-gray-light);
    border-radius: 5px;
    padding: 10px 12px;
    min-width: 140px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .kpi-step-label {
    font-size: 10.5px;
    font-weight: 700;
    color: var(--aiesec-black);
    line-height: 1.3;
    min-height: 28px;
  }
  .kpi-step input {
    padding: 4px 6px;
    font-size: 13px;
    font-weight: 700;
    font-family: var(--font-mono);
    text-align: center;
    border-radius: 3px;
  }
  .kpi-step .kpi-target {
    font-size: 10px;
    color: var(--aiesec-gray);
    text-align: center;
    font-family: var(--font-mono);
  }
  .kpi-arrow {
    align-self: center;
    color: var(--aiesec-gray);
    font-size: 16px;
    padding: 0 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    min-width: 60px;
  }
  .kpi-cvr {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 700;
    color: var(--aiesec-blue);
    background: var(--aiesec-blue-light);
    padding: 2px 6px;
    border-radius: 3px;
    margin-top: 2px;
  }
  .kpi-cvr.good { color: var(--aiesec-green); background: #e0f7ec; }
  .kpi-cvr.warn { color: var(--aiesec-orange); background: #feebd9; }
  .kpi-cvr.bad { color: var(--aiesec-red); background: #fee4e0; }

  /* Tables */
  table.data {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }
  table.data th {
    background: var(--aiesec-gray-bg);
    padding: 7px 10px;
    text-align: left;
    font-weight: 700;
    font-size: 10.5px;
    color: var(--aiesec-black);
    border-bottom: 1px solid var(--aiesec-gray-light);
    letter-spacing: 0.02em;
  }
  table.data td {
    padding: 5px 10px;
    border-bottom: 1px solid var(--aiesec-gray-light);
    vertical-align: top;
  }
  table.data td input, table.data td textarea, table.data td select {
    padding: 4px 6px;
    font-size: 11.5px;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 3px;
  }
  table.data td input:hover, table.data td textarea:hover { background: var(--aiesec-gray-bg); }
  table.data td input:focus, table.data td textarea:focus { background: #fff; border-color: var(--aiesec-blue); }
  table.data tr:last-child td { border-bottom: none; }

  /* Add buttons */
  .add-row-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 12px;
    background: transparent;
    border: 1px dashed var(--aiesec-gray);
    border-radius: 4px;
    color: var(--aiesec-gray);
    font-size: 11.5px;
    font-weight: 600;
    width: 100%;
    justify-content: center;
    margin-top: 8px;
    transition: all 0.15s;
  }
  .add-row-btn:hover {
    border-color: var(--aiesec-blue);
    color: var(--aiesec-blue);
    border-style: solid;
    background: var(--aiesec-blue-light);
  }
  .row-delete {
    background: transparent;
    border: none;
    color: var(--aiesec-gray);
    padding: 4px 6px;
    border-radius: 3px;
    font-size: 14px;
    line-height: 1;
  }
  .row-delete:hover { color: var(--aiesec-red); background: #fef0ee; }

  /* KPT block */
  .kpt-block {
    border: 1px solid var(--aiesec-gray-light);
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 12px;
  }
  .kpt-head {
    padding: 9px 14px;
    background: var(--aiesec-gray-bg);
    font-weight: 700;
    font-size: 12.5px;
    border-bottom: 1px solid var(--aiesec-gray-light);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .kpt-head .accent {
    width: 4px; height: 14px; border-radius: 1px;
    background: var(--aiesec-blue);
  }
  .kpt-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 0;
  }
  .kpt-cell {
    padding: 11px 14px;
    border-right: 1px solid var(--aiesec-gray-light);
  }
  .kpt-cell:last-child { border-right: none; }
  .kpt-label {
    font-family: var(--font-en);
    font-size: 10px;
    font-weight: 900;
    letter-spacing: 0.1em;
    margin-bottom: 6px;
    text-transform: uppercase;
  }
  .kpt-label.keep { color: var(--aiesec-green); }
  .kpt-label.problem { color: var(--aiesec-orange); }
  .kpt-label.try { color: var(--aiesec-blue); }
  .kpt-cell textarea {
    border: none;
    padding: 0;
    background: transparent;
    min-height: 70px;
    font-size: 12px;
  }
  .kpt-cell textarea:focus { box-shadow: none; }

  /* Good/More inline */
  .gm-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    border: 1px solid var(--aiesec-gray-light);
    border-radius: 4px;
    overflow: hidden;
  }
  .gm-cell { padding: 11px 14px; }
  .gm-cell:first-child { border-right: 1px solid var(--aiesec-gray-light); }
  .gm-cell .gm-label {
    font-family: var(--font-en);
    font-size: 10px;
    font-weight: 900;
    letter-spacing: 0.1em;
    margin-bottom: 6px;
    text-transform: uppercase;
  }
  .gm-cell.good .gm-label { color: var(--aiesec-green); }
  .gm-cell.more .gm-label { color: var(--aiesec-orange); }
  .gm-cell textarea {
    border: none;
    padding: 0;
    background: transparent;
    min-height: 70px;
    font-size: 12px;
  }
  .gm-cell textarea:focus { box-shadow: none; }

  /* Pills / Tags */
  .pill {
    display: inline-flex;
    align-items: center;
    padding: 2px 8px;
    font-size: 10px;
    font-weight: 700;
    border-radius: 3px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-family: var(--font-en);
  }
  .pill.blue { background: var(--aiesec-blue-light); color: var(--aiesec-blue); }
  .pill.green { background: #e0f7ec; color: var(--aiesec-green); }
  .pill.orange { background: #feebd9; color: var(--aiesec-orange); }
  .pill.red { background: #fee4e0; color: var(--aiesec-red); }
  .pill.yellow { background: #fff5d8; color: #8a6d00; }
  .pill.gray { background: var(--aiesec-gray-bg); color: var(--aiesec-black); }
  .pill.new {
    background: var(--aiesec-yellow);
    color: var(--aiesec-black);
    font-weight: 900;
  }

  /* OC member */
  .oc-card {
    border: 1px solid var(--aiesec-gray-light);
    border-radius: 5px;
    margin-bottom: 12px;
    background: #fff;
    overflow: hidden;
  }
  .oc-head {
    padding: 10px 14px;
    background: var(--aiesec-gray-bg);
    border-bottom: 1px solid var(--aiesec-gray-light);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .oc-role-input {
    border: 1px solid transparent;
    background: var(--aiesec-blue);
    color: #fff;
    font-size: 10.5px;
    font-weight: 700;
    font-family: var(--font-en);
    letter-spacing: 0.05em;
    width: 130px;
    padding: 3px 8px;
    border-radius: 3px;
    text-transform: uppercase;
  }
  .oc-role-input:focus { background: #fff; color: var(--aiesec-blue); border-color: var(--aiesec-blue); box-shadow: none; }
  .oc-name-input {
    border: none;
    background: transparent;
    font-size: 13px;
    font-weight: 700;
    flex: 1;
    padding: 4px 6px;
  }
  .oc-name-input:hover { background: #fff; }
  .oc-name-input:focus { background: #fff; border: 1px solid var(--aiesec-blue); box-shadow: none; }
  .oc-body { padding: 14px; }

  /* Snapshot dashboard */
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
  }
  .stat-tile {
    background: #fff;
    border: 1px solid var(--aiesec-gray-light);
    border-left: 3px solid var(--aiesec-blue);
    padding: 12px 14px;
    border-radius: 4px;
  }
  .stat-tile.green { border-left-color: var(--aiesec-green); }
  .stat-tile.orange { border-left-color: var(--aiesec-orange); }
  .stat-tile.red { border-left-color: var(--aiesec-red); }
  .stat-tile.yellow { border-left-color: var(--aiesec-yellow); }
  .stat-label {
    font-size: 10.5px;
    color: var(--aiesec-gray);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-family: var(--font-en);
    margin-bottom: 4px;
  }
  .stat-value {
    font-family: var(--font-en);
    font-weight: 900;
    font-size: 24px;
    color: var(--aiesec-black);
    line-height: 1;
  }
  .stat-sub {
    font-size: 11px;
    color: var(--aiesec-gray);
    margin-top: 4px;
  }

  /* Section dividers */
  .section-divider {
    margin: 24px 0 12px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--aiesec-gray-light);
    font-size: 12.5px;
    font-weight: 700;
    color: var(--aiesec-black);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-divider::before {
    content: '';
    width: 12px;
    height: 2px;
    background: var(--aiesec-blue);
  }

  /* Empty state */
  .empty {
    text-align: center;
    padding: 36px 20px;
    color: var(--aiesec-gray);
  }
  .empty h3 {
    color: var(--aiesec-black);
    font-size: 14px;
    margin: 0 0 6px;
  }
  .empty p { font-size: 12px; margin: 0; }

  /* Modal */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(82, 86, 94, 0.5);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .modal-backdrop.show { display: flex; }
  .modal {
    background: #fff;
    border-radius: 6px;
    width: 480px;
    max-width: 90vw;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
  }
  .modal-head {
    padding: 16px 20px;
    border-bottom: 1px solid var(--aiesec-gray-light);
    font-weight: 700;
    font-size: 15px;
  }
  .modal-body { padding: 20px; }
  .modal-foot {
    padding: 12px 20px;
    border-top: 1px solid var(--aiesec-gray-light);
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--aiesec-gray); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--aiesec-black); }

  /* Helpers */
  .muted { color: var(--aiesec-gray); }
  .mono { font-family: var(--font-mono); }
  .small { font-size: 11px; }
  .mt-12 { margin-top: 12px; }
  .mt-16 { margin-top: 16px; }
  .mb-12 { margin-bottom: 12px; }
  .flex { display: flex; }
  .flex-between { display: flex; justify-content: space-between; align-items: center; }
  .gap-8 { gap: 8px; }
  .gap-12 { gap: 12px; }

  /* Info callout */
  .callout {
    background: var(--aiesec-blue-light);
    border-left: 3px solid var(--aiesec-blue);
    padding: 10px 14px;
    border-radius: 4px;
    font-size: 12px;
    color: var(--aiesec-black);
    margin-bottom: 14px;
  }
  .callout.warn {
    background: #fff5d8;
    border-left-color: var(--aiesec-yellow);
  }
  .callout-title {
    font-weight: 700;
    margin-bottom: 4px;
    font-size: 11.5px;
  }

  /* Page transition fade */
  .page-content {
    animation: fadeIn 0.18s ease-out;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ========================================================
     RESPONSIVE
     - Desktop:  >= 1024px (default styles above)
     - Tablet:   768 - 1023px
     - Mobile:   < 768px
     ======================================================== */

  /* Hamburger button - hidden on desktop */
  .hamburger {
    display: none;
    background: transparent;
    border: 1px solid var(--aiesec-gray-light);
    border-radius: 4px;
    width: 36px; height: 36px;
    padding: 0;
    cursor: pointer;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 4px;
  }
  .hamburger span {
    display: block;
    width: 18px; height: 2px;
    background: var(--aiesec-black);
    border-radius: 1px;
    transition: transform 0.2s, opacity 0.2s;
  }
  .sidebar-backdrop {
    display: none;
    position: fixed; inset: 0;
    background: rgba(82, 86, 94, 0.45);
    z-index: 9;
  }
  .sidebar-backdrop.show { display: block; }

  /* ====== TABLET (< 1024px) ====== */
  @media (max-width: 1023px) {
    .app {
      grid-template-columns: 220px 1fr;
    }
    .main {
      padding: 24px 24px 80px;
    }
    .main-inner { max-width: 100%; }
    .field-row.cols-4 { grid-template-columns: 1fr 1fr; }
    .kpt-grid { grid-template-columns: 1fr 1fr; }
    .kpt-cell:nth-child(2) { border-right: none; }
    .kpt-cell:nth-child(3) {
      grid-column: 1 / -1;
      border-top: 1px solid var(--aiesec-gray-light);
    }
  }

  /* ====== MOBILE (< 768px) ====== */
  @media (max-width: 767px) {
    .app {
      grid-template-rows: 52px 1fr;
      grid-template-columns: 1fr;
      grid-template-areas: "header" "main";
    }

    /* Header */
    .header {
      padding: 0 12px;
      gap: 8px;
      flex-wrap: nowrap;
      overflow-x: auto;
    }
    .hamburger {
      display: flex;
      flex-shrink: 0;
    }
    .brand-title { display: none; }
    .header-spacer { flex: 1; min-width: 0; }
    .lc-selector {
      padding: 4px 8px;
      gap: 4px;
      flex-shrink: 0;
    }
    .lc-selector label { display: none; }
    .lc-selector select {
      min-width: 60px;
      font-size: 12px;
    }
    .term-pill {
      padding: 4px 7px;
      font-size: 10px;
      flex-shrink: 0;
    }
    .save-indicator {
      font-size: 10px;
      gap: 4px;
    }
    .save-indicator { display: none; } /* hide on mobile, keep status only in save button */
    .header .btn.sm {
      padding: 4px 7px;
      font-size: 10px;
      flex-shrink: 0;
    }

    /* Sidebar becomes slide-out drawer */
    .sidebar {
      position: fixed;
      top: 52px;
      left: 0;
      bottom: 0;
      width: 250px;
      transform: translateX(-100%);
      transition: transform 0.22s ease-out;
      z-index: 10;
      box-shadow: 2px 0 12px rgba(0,0,0,0.08);
    }
    .sidebar.open { transform: translateX(0); }

    /* Main */
    .main {
      padding: 18px 14px 60px;
    }

    /* Page head: stack save btn below */
    .page-head {
      flex-direction: column;
      align-items: stretch;
      gap: 12px;
      padding-bottom: 14px;
      margin-bottom: 16px;
    }
    .page-head h1 { font-size: 20px; }
    .page-head .desc { font-size: 12px; }
    .page-save-btn { width: 100%; }

    /* Reference panel */
    .ref-panel {
      padding: 10px 12px;
      gap: 10px;
    }
    .ref-panel-icon {
      width: 32px; height: 20px;
      font-size: 9px;
    }
    .ref-panel-title { font-size: 10px; }
    .ref-panel-title::after { display: block; margin-left: 0; margin-top: 2px; }
    .ref-link { font-size: 10.5px; padding: 3px 8px; }

    /* Cards */
    .card-head {
      padding: 10px 12px;
      flex-wrap: wrap;
      gap: 6px;
    }
    .card-head h2 { font-size: 13px; }
    .card-head .sub { font-size: 9.5px; }
    .card-body { padding: 14px 12px; }

    /* Field rows: stack everything */
    .field-row.cols-2,
    .field-row.cols-3,
    .field-row.cols-4 {
      grid-template-columns: 1fr;
    }

    /* KPT: full stack */
    .kpt-grid { grid-template-columns: 1fr; }
    .kpt-cell {
      border-right: none;
      border-bottom: 1px solid var(--aiesec-gray-light);
    }
    .kpt-cell:last-child { border-bottom: none; }

    /* Good/More: stack */
    .gm-grid { grid-template-columns: 1fr; }
    .gm-cell:first-child {
      border-right: none;
      border-bottom: 1px solid var(--aiesec-gray-light);
    }

    /* Stat tiles: 2 cols on mobile */
    .stat-grid {
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .stat-tile { padding: 10px 12px; }
    .stat-value { font-size: 20px; }

    /* Tables: horizontal scroll wrapper */
    .card-body table.data {
      display: block;
      overflow-x: auto;
      white-space: nowrap;
      min-width: 0;
    }
    table.data th, table.data td { white-space: normal; }
    table.data td input,
    table.data td textarea { min-width: 100px; }

    /* OC member card */
    .oc-head {
      flex-wrap: wrap;
      gap: 6px;
      padding: 8px 10px;
    }
    .oc-role-input { width: 100px; font-size: 9.5px; }
    .oc-name-input { font-size: 12px; min-width: 100px; }
    .oc-body { padding: 12px; }

    /* Modal */
    .modal {
      width: 92vw;
    }

    /* Page-save kbd hidden on mobile */
    .page-save-btn .kbd { display: none; }

    /* Add row button */
    .add-row-btn { font-size: 11px; padding: 8px 10px; }

    /* Section divider */
    .section-divider { font-size: 11.5px; margin: 18px 0 10px; }
  }

  /* ====== SMALL MOBILE (< 400px) ====== */
  @media (max-width: 399px) {
    .stat-grid { grid-template-columns: 1fr; }
    .main { padding: 14px 10px 60px; }
    .card-body { padding: 12px 10px; }
    .page-head h1 { font-size: 18px; }
  }

  /* ========================================================
     LOGIN / IDENTITY
     ======================================================== */
  .login-screen {
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: linear-gradient(135deg, #037EF3 0%, #0257b8 100%);
    display: grid;
    place-items: center;
    padding: 20px;
    overflow-y: auto;
  }
  .login-card {
    background: #fff;
    border-radius: 12px;
    padding: 40px 36px;
    max-width: 480px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    text-align: center;
  }
  .login-logo {
    width: 64px; height: 64px;
    margin: 0 auto 18px;
    background: var(--aiesec-blue);
    border-radius: 10px;
    display: grid;
    place-items: center;
  }
  .login-logo img { width: 42px; height: auto; display: block; }
  .login-title {
    font-size: 19px;
    font-weight: 800;
    margin: 0 0 10px;
    color: var(--aiesec-black);
  }
  .login-sub {
    font-size: 12.5px;
    line-height: 1.7;
    color: var(--aiesec-gray);
    margin: 0 0 26px;
  }
  .login-label {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.08em;
    color: var(--aiesec-gray);
    text-transform: uppercase;
    margin-bottom: 12px;
    text-align: left;
  }
  .login-role-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .login-role-btn {
    border: 2px solid var(--aiesec-gray-light);
    background: #fff;
    border-radius: 9px;
    padding: 20px 14px;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    flex-direction: column;
    gap: 8px;
    text-align: center;
  }
  .login-role-btn:hover {
    border-color: var(--aiesec-blue);
    background: var(--aiesec-blue-light);
    transform: translateY(-2px);
  }
  .login-role-btn .lr-title {
    font-size: 16px;
    font-weight: 800;
    color: var(--aiesec-black);
  }
  .login-role-btn .lr-desc {
    font-size: 10.5px;
    line-height: 1.6;
    color: var(--aiesec-gray);
  }
  .login-select {
    width: 100%;
    padding: 12px 14px;
    font-size: 14px;
    font-weight: 700;
    border: 2px solid var(--aiesec-gray-light);
    border-radius: 8px;
    background: #fff;
    margin-bottom: 18px;
    font-family: var(--font-jp);
  }
  .login-select:focus {
    outline: none;
    border-color: var(--aiesec-blue);
  }
  .login-actions {
    display: flex;
    gap: 10px;
    justify-content: space-between;
  }
  .login-actions .btn { flex: 1; }
  .login-err {
    margin-top: 14px;
    background: #fdeaea;
    border: 1px solid #f0b5b5;
    color: #b5302b;
    border-radius: 6px;
    padding: 10px 12px;
    font-size: 12px;
    line-height: 1.6;
  }
  .login-foot {
    margin-top: 14px;
    font-size: 11px;
    color: var(--aiesec-gray);
  }
  .login-foot a {
    color: var(--aiesec-blue);
    cursor: pointer;
    text-decoration: underline;
  }

  .identity-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--aiesec-gray-bg);
    border: 1px solid var(--aiesec-gray-light);
    border-radius: 5px;
    padding: 6px 10px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    color: var(--aiesec-black);
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .identity-badge:hover {
    border-color: var(--aiesec-blue);
    color: var(--aiesec-blue);
  }
  .identity-badge .ib-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--aiesec-green);
    flex-shrink: 0;
  }

  .perm-note {
    background: #fff3e0;
    border: 1px solid #f0c98a;
    color: #8a5a00;
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 12px;
    line-height: 1.6;
    margin-bottom: 14px;
  }

  .ro-banner {
    position: sticky;
    top: 0;
    z-index: 5;
    background: #4a4f57;
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    padding: 9px 16px;
    border-radius: 6px;
    margin-bottom: 16px;
    line-height: 1.6;
  }
  .readonly-mode input,
  .readonly-mode textarea,
  .readonly-mode select {
    background: var(--aiesec-gray-bg) !important;
    cursor: not-allowed;
  }
  .readonly-mode .card-save-btn,
  .readonly-mode .add-row-btn,
  .readonly-mode .row-delete {
    opacity: 0.4;
    cursor: not-allowed;
  }

  /* MC dashboard */
  .mc-stat-row {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
  }
  .mc-stat-row .stat-tile { padding: 12px 14px; }
  .stat-unit { font-size: 12px; color: var(--aiesec-gray); font-weight: 600; margin-left: 3px; }
  table.mc-table th, table.mc-table td { white-space: nowrap; text-align: center; }
  table.mc-table td:first-child, table.mc-table th:first-child { text-align: left; }
  table.mc-table tr.mc-total td { background: var(--aiesec-blue-light); border-top: 2px solid var(--aiesec-blue); }
  table.mc-table tr.mc-empty td { background: #fafafa; }
  .mc-prog { display: flex; align-items: center; gap: 6px; justify-content: center; }
  .mc-prog-bar {
    width: 54px; height: 7px;
    background: var(--aiesec-gray-light);
    border-radius: 4px; overflow: hidden;
  }
  .mc-prog-bar span { display: block; height: 100%; border-radius: 4px; }
  .mc-prog-bar span.good { background: var(--aiesec-green); }
  .mc-prog-bar span.warn { background: var(--aiesec-yellow); }
  .mc-prog-bar span.bad  { background: var(--aiesec-red); }
  .mc-prog-num { font-size: 10.5px; font-weight: 700; color: var(--aiesec-gray); }
  @media (max-width: 767px) {
    .mc-stat-row { grid-template-columns: 1fr 1fr; }
  }

  /* Per-area handover items (overview) */
  .handover-item {
    border: 1px solid var(--aiesec-gray-light);
    border-radius: 7px;
    padding: 12px 14px;
    margin-bottom: 10px;
    background: var(--aiesec-gray-bg);
  }
  .handover-item-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 8px;
  }
  .handover-item-label { font-weight: 700; font-size: 13px; }
  .handover-jump { flex-shrink: 0; }
  .handover-ta {
    width: 100%;
    min-height: 56px;
    resize: vertical;
    font-family: var(--font-jp);
    font-size: 13px;
    padding: 8px 10px;
    border: 1px solid var(--aiesec-gray-light);
    border-radius: 5px;
    background: #fff;
  }
  .handover-ta:focus { outline: none; border-color: var(--aiesec-blue); }

  /* AJ total block on overview snapshot */
  .aj-total {
    border: 1px dashed var(--aiesec-blue);
    background: var(--aiesec-blue-light);
    border-radius: 8px;
    padding: 12px 16px;
  }
  .aj-total-head {
    display: flex; align-items: center;
    font-weight: 800; font-size: 12px;
    color: var(--aiesec-blue-dark);
    margin-bottom: 10px;
  }
  .aj-total-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
  }
  .aj-total-grid > div {
    display: flex; flex-direction: column; gap: 2px;
    text-align: center;
  }
  .aj-n { font-family: var(--font-en); font-weight: 900; font-size: 19px; color: var(--aiesec-black); }
  .aj-l { font-size: 10px; color: var(--aiesec-gray); }
  @media (max-width: 767px) {
    .aj-total-grid { grid-template-columns: 1fr 1fr; }
    .handover-item-head { flex-wrap: wrap; }
  }

  .jd-ref-hint {
    margin-top: 8px;
    background: var(--aiesec-blue-light);
    border-left: 3px solid var(--aiesec-blue);
    border-radius: 4px;
    padding: 8px 12px;
    font-size: 11.5px;
    line-height: 1.7;
    color: var(--aiesec-black);
  }

  @media (max-width: 767px) {
    .login-card { padding: 30px 22px; }
    .login-role-grid { grid-template-columns: 1fr; }
    .identity-badge { padding: 5px 8px; font-size: 10px; }
    .identity-badge span:not(.ib-dot) { max-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  }
</style>

<body>

<!-- LOGIN / IDENTITY SCREEN -->
<div class="login-screen" id="loginScreen" style="display:none;">
  <div class="login-card">
    <div class="login-logo" id="loginLogo"></div>
    <h1 class="login-title">2627term Spring Recruitment FR</h1>

    <!-- Step A: Google認証 -->
    <div class="login-step" id="loginStepAuth">

let state = {
  currentLC: 'KO',
  currentPage: 'overview',
  identity: null,        // { role:'MC'|'LC', lc:コード }  未設定ならログイン画面
  globalCatalog: {},     // { catalog_key: url }  MC共通管理・全LC共有
  lcs: {} // {lc_code: LC_DATA}
};

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      state = { ...state, ...parsed };
    }
  } catch (e) { console.error('Load failed', e); }
  if (!state.lcs) state.lcs = {};
  // 旧版（Keio/Waseda等の英語名）→新版（KO/WA等のコード）マイグレーション
  const LEGACY_MAP = {
    'Hokkaido':'HD','Aoyama':'AG','Chiba':null,'ICU':null,'Kanazawa':null,
    'Hitotsubashi':'HI','Sophia':'JO','Keio':'KO','Meiji':'MJ','Rikkyo':'SP',
    'Tsukuba':'TKB','Tokyo':'TO','Waseda':'WA','Nagoya':'NA','Doshisha':'DO',
    'Kobe':'KB','Kwansei':'KG','Kyoto':'KT','Osaka':'OS','Hiroshima':'HU',
    'Tohoku':null,'Yokohama':null,'Other':null
  };
  Object.keys(state.lcs).forEach(k => {
    if (LEGACY_MAP[k] && !state.lcs[LEGACY_MAP[k]]) {
      state.lcs[LEGACY_MAP[k]] = state.lcs[k];
      state.lcs[LEGACY_MAP[k]].meta.lc = LEGACY_MAP[k];
      delete state.lcs[k];
    }
  });
  if (LEGACY_MAP[state.currentLC]) state.currentLC = LEGACY_MAP[state.currentLC];
  if (!state.currentLC || !LC_LIST.includes(state.currentLC)) state.currentLC = 'KO';
  if (!state.lcs[state.currentLC]) {
    state.lcs[state.currentLC] = DEFAULT_LC_DATA();
    state.lcs[state.currentLC].meta.lc = state.currentLC;
  }

  // --- 標準カタログURLをグローバル共有領域へマイグレーション ---
  if (!state.globalCatalog || typeof state.globalCatalog !== 'object') state.globalCatalog = {};
  Object.values(state.lcs).forEach(lcData => {
    if (lcData.resources && Array.isArray(lcData.resources.custom)) {
      lcData.resources.custom.forEach(r => {
        if (r.catalog_key && r.url && !state.globalCatalog[r.catalog_key]) {
          state.globalCatalog[r.catalog_key] = r.url;
        }
      });
      // 旧catalog_keyエントリは各LCのcustomから除去（グローバルに移したため）
      lcData.resources.custom = lcData.resources.custom.filter(r => !r.catalog_key);
    }
  });

  // identity 未設定ならログインフローへ（INITで判定）
  if (state.identity && (!state.identity.role ||
      (state.identity.role === 'LC' && !LC_LIST.includes(state.identity.lc)))) {
    state.identity = null;
  }
}

let saveTimer = null;
function saveState() {
  const indicator = document.getElementById('saveIndicator');
  indicator.classList.add('saving');
  indicator.textContent = '保存中…';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      indicator.classList.remove('saving');
      // Firebase接続中はクラウド保存表示、未設定時はローカル表示
      indicator.textContent = (typeof fb !== 'undefined' && fb.ready && state.identity && state.identity.email)
        ? 'クラウド同期中…' : 'ローカル保存済み';
    } catch (e) {
      indicator.textContent = '保存エラー';
      console.error(e);
    }
  }, 350);
  // Firestoreへ反映（権限はクライアント＋Rules両方で制御）
  if (typeof fbQueueSave === 'function') fbQueueSave();
}

function currentData() {
  if (!state.lcs[state.currentLC]) {
    state.lcs[state.currentLC] = DEFAULT_LC_DATA();
    state.lcs[state.currentLC].meta.lc = state.currentLC;
  }
  return state.lcs[state.currentLC];
}

/* =========================================================
   HELPERS
   ========================================================= */
function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function bindInput(selector, getValue, setValue, onChange) {
  const el = document.querySelector(selector);
  if (!el) return;
  el.value = getValue() ?? '';
  el.oninput = () => {
    setValue(el.value);
    saveState();
    if (onChange) onChange();
  };
}

function pct(n, d) {
  if (!n || !d) return null;
  const v = (parseFloat(n) / parseFloat(d)) * 100;
  if (!isFinite(v) || isNaN(v)) return null;
  return v;
}
function fmtPct(v) {
  if (v == null) return '–';
  return v.toFixed(1) + '%';
}
function cvrClass(v) {
  if (v == null) return '';
  if (v >= 40) return 'good';
  if (v >= 15) return '';
  if (v >= 5) return 'warn';
  return 'bad';
}

function addBtnHtml(id, label) {
  return `<button class="add-row-btn" id="${id}">${label}</button>`;
}

/* =========================================================
   PERMISSIONS (self-declared role; soft enforcement)
   ========================================================= */
function isMC()  { return state.identity && state.identity.role === 'MC'; }
// 標準カタログ: MCのみ編集可
function canEditCatalog() { return isMC(); }
// カスタム資料: 表示中LC本人 または MC(管理者) のみ編集可
function canEditCustom(lcCode) {
  if (isMC()) return true;
  return state.identity && state.identity.role === 'LC' && state.identity.lc === lcCode;
}
function identityLabel() {
  if (!state.identity) return '未ログイン';
  return state.identity.role === 'MC' ? 'MC' : state.identity.lc;
}

function renderRefPanel(refKeys) {
  if (!refKeys || !refKeys.length) return '';
  const data = currentData();
  const refs = refKeys.map(k => {
    // 標準カタログURLはグローバル共有領域から解決
    const base = REF_CATALOG[k];
    if (!base) return null;
    const url = state.globalCatalog[k] || base.url || '';
    return { ...base, url, key: k };
  }).filter(Boolean);
  if (!refs.length) return '';
  return `
    <div class="ref-panel">
      <div class="ref-panel-icon">REF</div>
      <div class="ref-panel-content">
        <div class="ref-panel-title">References</div>
        <div class="ref-links">
          ${refs.map(r => r.url
            ? `<a href="${escapeHtml(r.url)}" target="_blank" rel="noopener" class="ref-link" title="${escapeHtml(r.desc)}">${escapeHtml(r.name)}</a>`
            : `<span class="ref-link no-url" title="URLが未登録です。資料集タブで登録してください。">${escapeHtml(r.name)}</span>`
          ).join('')}
        </div>
        <div class="ref-panel-hint">URLが灰色のものは「資料集」タブでURLを登録すると有効になります。</div>
      </div>
    </div>
  `;
}

function pageHead(crumbs, title, desc, refKeys) {
  return `
    <div class="page-head">
      <div class="page-head-content">
        <div class="crumbs">${crumbs}</div>
        <h1>${title}</h1>
        <div class="desc">${desc}</div>
      </div>
      <div>
        <button class="btn primary page-save-btn" onclick="savePageNow(this)">保存<span class="kbd">⌘S</span></button>
      </div>
    </div>
    ${renderRefPanel(refKeys || [])}
  `;
}

function savePageNow(btn) {
  clearTimeout(saveTimer);
  const indicator = document.getElementById('saveIndicator');
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    indicator.classList.remove('saving');
    indicator.textContent = '自動保存済み';
    if (btn) {
      const original = btn.innerHTML;
      btn.innerHTML = '保存しました';
      btn.classList.add('saved');
      btn.disabled = true;
      setTimeout(() => {
        btn.innerHTML = original;
        btn.classList.remove('saved');
        btn.disabled = false;
      }, 1300);
    }
  } catch (e) {
    indicator.textContent = '保存エラー';
    console.error(e);
  }
}

document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === 's') {

    savePageNow(document.querySelector('.page-save-btn'));

function renderKgiCustom(data) {

        <thead><tr><th>KGI名</th><th style="width:140px">数値</th><th style="width:36px"></th></tr></thead>
        <tbody>
          ${list.map((it, i) => `

              <td><input type="number" data-k="value" value="${escapeHtml(it.value||'')}" /></td>

            </tr>
          `).join('')}
        </tbody>
      </table>
      ${addBtnHtml('addKgi', '＋ 独自KGIを追加')}
    `;
  }
  document.getElementById('addKgi').onclick = () => {
    list.push({ name: '', value: '' });
    saveState();
    renderKgiCustom(data);
  };

      saveState();

    b.onclick = () => { list.splice(parseInt(b.dataset.del), 1); saveState(); renderKgiCustom(data); };

}

const INVEST_OPTIONS = ['ビラ発注', 'SNS有料広告', '会場費', '登壇者交通費補助', 'その他（記述）'];

function renderInvestBox(data) {
  const box = document.getElementById('investBox');
  if (!data.direction.investments.length) {
    box.innerHTML = `<div class="empty"><h3>投資項目がまだありません</h3><p>ビラ発注・SNS有料広告・会場費などの費用感と振り返りを残します</p></div>${addBtnHtml('addInvest', '＋ 投資項目を追加')}`;
  } else {
    box.innerHTML = `
      <table class="data">
        <thead><tr>
          <th style="width:200px">投資した項目</th>
          <th style="width:120px">費用</th>
          <th>申し送り</th>
          <th style="width:36px"></th>
        </tr></thead>
        <tbody>
          ${data.direction.investments.map((it, i) => `
            <tr data-i="${i}">
              <td>
                <select data-k="item">
                  <option value="">選択してください</option>
                  ${INVEST_OPTIONS.map(o => `<option value="${o}" ${it.item===o?'selected':''}>${o}</option>`).join('')}
                </select>
                ${it.item === 'その他（記述）' ? `<input type="text" data-k="item_other" value="${escapeHtml(it.item_other||'')}" placeholder="項目名を記述" style="margin-top:6px" />` : ''}
              </td>
              <td><input type="text" data-k="cost" value="${escapeHtml(it.cost)}" placeholder="¥" /></td>

            </tr>
          `).join('')}
        </tbody>
      </table>
      ${addBtnHtml('addInvest', '＋ 投資項目を追加')}
    `;
  }
  document.getElementById('addInvest').onclick = () => {
    data.direction.investments.push({ item: '', item_other: '', cost: '', note: '' });
    saveState();
    renderInvestBox(data);
  };
  box.querySelectorAll('select,input,textarea').forEach(el => {
    const handler = () => {
      const i = parseInt(el.closest('tr').dataset.i);
      data.direction.investments[i][el.dataset.k] = el.value;
      saveState();
      if (el.dataset.k === 'item') renderInvestBox(data); // その他欄の出し入れ
    };
    el.oninput = handler;
    if (el.tagName === 'SELECT') el.onchange = handler;
  });
  box.querySelectorAll('[data-del]').forEach(b => {
    b.onclick = () => {
      data.direction.investments.splice(parseInt(b.dataset.del), 1);
      saveState();
      renderInvestBox(data);
    };
  });
}

function renderUniTable(U, key, boxId, cfg) {
  const box = document.getElementById(boxId);
  const list = U[key];
  const render = () => {
    if (!list.length) {
      box.innerHTML = `<div class="empty small"><p>${cfg.empty}</p></div>${addBtnHtml('add_'+key, cfg.addLabel)}`;
    } else {
      box.innerHTML = `
        <div style="overflow-x:auto">
        <table class="data">
          <thead><tr>${cfg.cols.map(c => `<th${c.w?` style="width:${c.w}px"`:''}>${c.label}</th>`).join('')}<th style="width:36px"></th></tr></thead>
          <tbody>
            ${list.map((row, i) => `
              <tr data-i="${i}">
                ${cfg.cols.map(c => {
                  const val = row[c.k] || '';
                  if (c.type === 'select') {
                    return `<td><select data-k="${c.k}"><option value="">未選択</option>${c.opts.map(o => `<option value="${o}" ${val===o?'selected':''}>${o}</option>`).join('')}</select></td>`;
                  }
                  if (c.type === 'textarea') {
                    return `<td><textarea data-k="${c.k}" placeholder="${c.ph?escapeHtml(c.ph):''}">${escapeHtml(val)}</textarea></td>`;
                  }
                  return `<td><input type="${c.type}" data-k="${c.k}" value="${escapeHtml(val)}" placeholder="${c.ph?escapeHtml(c.ph):''}" /></td>`;
                }).join('')}
                <td><button class="row-delete" data-del="${i}">×</button></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
        </div>
        ${addBtnHtml('add_'+key, cfg.addLabel)}
      `;
    }
    document.getElementById('add_'+key).onclick = () => {
      const blank = {}; cfg.cols.forEach(c => blank[c.k] = '');
      list.push(blank); saveState(); render();
    };
    box.querySelectorAll('input,textarea,select').forEach(el => {
      const h = () => {
        const i = parseInt(el.closest('tr').dataset.i);
        list[i][el.dataset.k] = el.value;
        saveState();
      };
      el.oninput = h;
      if (el.tagName === 'SELECT') el.onchange = h;
    });
    box.querySelectorAll('[data-del]').forEach(b => {
      b.onclick = () => { list.splice(parseInt(b.dataset.del), 1); saveState(); render(); };
    });
  };
  render();
}

function renderOCMembers(data) {

      <div class="oc-head">
        <input type="text" class="oc-role-input" data-i="${i}" data-k="role" value="${escapeHtml(m.role)}" placeholder="役職 (例: 採用OCP)" />
        <input type="text" class="oc-name-input" data-i="${i}" data-k="name" value="${escapeHtml(m.name)}" placeholder="名前" />
        <button class="btn danger sm" data-del="${i}">削除</button>
      </div>
      <div class="oc-body">
        <div class="field"><label>アサインの背景</label><textarea data-i="${i}" data-k="assign_bg">${escapeHtml(m.assign_bg)}</textarea></div>
        <div class="field">
          <label>該当termにおけるJD <span class="hint">標準JDから選択。不足分は下の補足に追記</span></label>
          <select class="oc-jd-select" data-i="${i}" data-k="jd_type">
            <option value="">選択してください</option>
            ${JD_OPTIONS.map(o => `<option value="${o}" ${(m.jd_type||'')===o?'selected':''}>${o}</option>`).join('')}
          </select>
          ${m.jd_type && m.jd_type !== 'その他' ? `<div class="jd-ref-hint">${(STANDARD_JD.find(j=>j.name===m.jd_type)?.desc||[]).map(d=>'・'+escapeHtml(d)).join('<br>')}</div>` : ''}

        <div class="field"><label>JD詳細・補足 <span class="hint">標準JDで不足する場合・このterm固有の役割を追記</span></label><textarea data-i="${i}" data-k="jd" class="tall">${escapeHtml(m.jd)}</textarea></div>

        <div class="field"><label>この役職として意識すべきこと</label><textarea data-i="${i}" data-k="awareness">${escapeHtml(m.awareness)}</textarea></div>

function snsBlockHtml(prefix, title, badge, src) {
  return `
    <div class="card">
      <div class="card-head">
        <h2>${title} ${badge ? `<span class="pill orange" style="margin-left:6px">${badge}</span>` : ''}</h2>
        <div class="sub">${prefix.toUpperCase()}</div>
      </div>
      <div class="card-body">
        <div class="field-row cols-2">
          <div class="field">
            <label>Role / Reach戦略での位置付け</label>
            <textarea id="${prefix}_role">${escapeHtml(src.role)}</textarea>
          </div>
          <div class="field">
            <label>Overall Purpose</label>
            <textarea id="${prefix}_purpose">${escapeHtml(src.purpose)}</textarea>
          </div>
        </div>
        <div class="field">
          <label>Performance</label>
          <select id="${prefix}_perf">
            <option value="good" ${src.performance==='good'?'selected':''}>Good</option>
            <option value="fair" ${src.performance==='fair'?'selected':''}>Fair</option>
            <option value="bad" ${src.performance==='bad'?'selected':''}>More</option>
          </select>
        </div>
        <div class="field-row cols-2">
          <div class="field">
            <label>Good Case <span class="hint">運用上うまくいったこと</span></label>
            <textarea id="${prefix}_good">${escapeHtml(src.good_case)}</textarea>
          </div>
          <div class="field">
            <label>More Case <span class="hint">うまくいかなかったこと</span></label>
            <textarea id="${prefix}_bad">${escapeHtml(src.bad_case)}</textarea>
          </div>
        </div>
        <div class="field">
          <label>運用を通した学び / インサイト</label>
          <textarea id="${prefix}_insight"></textarea>
        </div>

        <div class="section-divider">Top Engagement Posts</div>
        <div id="${prefix}_posts"></div>

        <div class="section-divider">次年度への申し送り</div>
        ${kptHtml(prefix)}
      </div>
    </div>
  `;
}

function renderSNSPosts(prefix, src) {
  const box = document.getElementById(`${prefix}_posts`);
  if (!src.top_posts) src.top_posts = [];
  if (!src.top_posts.length) {
    box.innerHTML = `<div class="empty small"><p>Top投稿がまだ登録されていません</p></div>${addBtnHtml(`add_${prefix}_post`, '＋ Top投稿を追加 (Reach / Profile visit / CVR上位)')}`;
  } else {
    box.innerHTML = `
      <table class="data">
        <thead><tr>
          <th style="width:80px">指標</th>
          <th style="width:30px">#</th>
          <th>投稿概要</th>
          <th>目的</th>
          <th>背景にある仮説</th>
          <th style="width:140px">リンク</th>
          <th style="width:36px"></th>
        </tr></thead>
        <tbody>
          ${src.top_posts.map((p, i) => `
            <tr data-i="${i}">
              <td><select data-k="type">
                ${['reach', 'profile_visit', 'cvr'].map(t => `<option value="${t}" ${p.type===t?'selected':''}>${t}</option>`).join('')}
              </select></td>
              <td><input type="number" data-k="rank" value="${escapeHtml(p.rank)}" /></td>
              <td><input type="text" data-k="summary" value="${escapeHtml(p.summary)}" /></td>
              <td><input type="text" data-k="goal" value="${escapeHtml(p.goal)}" /></td>
              <td><textarea data-k="hypothesis">${escapeHtml(p.hypothesis)}</textarea></td>
              <td><input type="url" data-k="link" value="${escapeHtml(p.link)}" placeholder="https://..." /></td>
              <td><button class="row-delete" data-del="${i}">×</button></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
      ${addBtnHtml(`add_${prefix}_post`, '＋ Top投稿を追加')}
    `;
  }
  document.getElementById(`add_${prefix}_post`).onclick = () => {
    src.top_posts.push({ type: 'reach', rank: src.top_posts.length + 1, summary: '', goal: '', hypothesis: '', link: '' });
    saveState();
    renderSNSPosts(prefix, src);
  };
  box.querySelectorAll('input,textarea,select').forEach(el => {
    el.oninput = el.onchange = () => {
      const i = parseInt(el.closest('tr').dataset.i);
      src.top_posts[i][el.dataset.k] = el.value;
      saveState();
    };
  });
  box.querySelectorAll('[data-del]').forEach(b => {
    b.onclick = () => {
      src.top_posts.splice(parseInt(b.dataset.del), 1);
      saveState();
      renderSNSPosts(prefix, src);
    };
  });
}

    renderEventList(src);

function renderEventList(src) {
  const box = document.getElementById('eventList');
  if (!src.events.length) {
    box.innerHTML = `<div class="empty small"><p>イベントがまだ登録されていません</p></div>`;
    return;
  }
  box.innerHTML = `
    <table class="data">
      <thead><tr>
        <th style="width:200px">イベント名</th>
        <th style="width:110px">開催日</th>
        <th style="width:80px">申込</th>
        <th style="width:80px">参加</th>
        <th style="width:80px">CVR</th>
        <th>コンテンツ / アピールポイント</th>
        <th>Good / More</th>
        <th style="width:36px"></th>
      </tr></thead>
      <tbody>
        ${src.events.map((e, i) => {
          const cvr = pct(e.attend, e.apply);
          return `
            <tr data-i="${i}">
              <td><input type="text" data-k="name" value="${escapeHtml(e.name)}" /></td>
              <td><input type="date" data-k="date" value="${escapeHtml(e.date)}" /></td>
              <td><input type="number" data-k="apply" value="${escapeHtml(e.apply)}" /></td>
              <td><input type="number" data-k="attend" value="${escapeHtml(e.attend)}" /></td>
              <td><span class="kpi-cvr ${cvrClass(cvr)}" style="font-size:11px">${fmtPct(cvr)}</span></td>
              <td><textarea data-k="content">${escapeHtml(e.content)}</textarea></td>
              <td><textarea data-k="good_more">${escapeHtml(e.good_more)}</textarea></td>
              <td><button class="row-delete" data-del="${i}">×</button></td>
            </tr>
          `;
        }).join('')}
      </tbody>
    </table>
  `;
  box.querySelectorAll('input,textarea').forEach(el => {
    el.oninput = () => {
      const i = parseInt(el.closest('tr').dataset.i);
      src.events[i][el.dataset.k] = el.value;
      saveState();
      if (el.dataset.k === 'apply' || el.dataset.k === 'attend') renderEventList(src);
    };
  });
  box.querySelectorAll('[data-del]').forEach(b => {
    b.onclick = () => {
      src.events.splice(parseInt(b.dataset.del), 1);
      saveState();
      renderEventList(src);
    };
  });
}

let _mcAllLcs = null;       // {LC: data}
let _mcLoading = false;

async function fbLoadAllLCs() {
  if (!fb.ready || !state.identity) { _mcAllLcs = null; return; }
  _mcLoading = true;
  try {
    const snap = await fb.db.collection('lcs').get();
    const out = {};
    snap.forEach(doc => { if (doc.data() && doc.data().data) out[doc.id] = doc.data().data; });
    _mcAllLcs = out;
  } catch (e) {
    console.error('load all lcs', e);
    _mcAllLcs = {};
  }
  _mcLoading = false;
}

// 進捗(入力率)を代表フィールドで概算
function mcProgress(d) {
  if (!d) return 0;
  const f = (x) => x !== undefined && x !== null && String(x).trim() !== '';
  const fa = (p) => d.funnel && d.funnel[p] && f(d.funnel[p].actual);
  const checks = [
    f(d.overview && d.overview.target_total),
    f(d.overview && d.overview.actual_total),
    f(d.overview && d.overview.handover_summary),
    f(d.overview && d.overview.top_priority),
    f(d.direction && d.direction.lc_direction),
    fa('total_reach'), fa('line_registration'), fa('event_attend'),
    fa('af_submit'), fa('pass'), fa('paid'),
    f(d.reach_overall && d.reach_overall.purpose),
    f(d.funnel_handover && d.funnel_handover.calc_method),
    f(d.customer_journey && d.customer_journey.design),
    f(d.oc && d.oc.structure_note)
  ];
  const done = checks.filter(Boolean).length;
  return Math.round(done / checks.length * 100);
}
function num(v) { const n = parseFloat(v); return isFinite(n) ? n : null; }
function aOf(d, key) { return d && d.funnel && d.funnel[key] ? num(d.funnel[key].actual) : null; }
function pOf(d, key) { return d && d.funnel && d.funnel[key] ? num(d.funnel[key].plan) : null; }

  };

    const cls = p >= 70 ? 'good' : p >= 30 ? 'warn' : 'bad';

  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);

/* ---------- Firestore helpers ---------- */
const FS = {
  catalogRef: () => fb.db.collection('config').doc('globalCatalog'),
  lcRef:      (code) => fb.db.collection('lcs').doc(code),
  userRef:    (uid) => fb.db.collection('users').doc(uid),
  adminRef:   (email) => fb.db.collection('admins').doc(email.toLowerCase()),
};

let _fbUnsub = { catalog: null, viewLc: null };
let _fbWriteTimer = null;
let _applyingRemote = false;   // リモート反映中の保存ループ防止

// 現在表示中LCを自分が編集できるか（FRデータ本体の編集可否）
function canEditCurrentLC() {
  return isMC() || (state.identity && state.identity.role === 'LC' && state.identity.lc === state.currentLC);
}

async function fbLoadGlobalCatalog() {
  try {
    const snap = await FS.catalogRef().get();
    if (snap.exists) state.globalCatalog = snap.data().urls || {};
  } catch (e) { console.error('catalog load', e); }
  // リアルタイム購読（MCの更新を全員に反映）
  if (_fbUnsub.catalog) _fbUnsub.catalog();
  _fbUnsub.catalog = FS.catalogRef().onSnapshot(snap => {
    if (!snap.exists) return;
    state.globalCatalog = snap.data().urls || {};
    if (state.currentPage === 'resources') renderPage();
    else if (document.querySelector('.ref-panel')) renderPage();
  });
}

async function fbLoadLC(code, { subscribe } = {}) {
  try {
    const snap = await FS.lcRef(code).get();
    if (snap.exists && snap.data().data) {
      state.lcs[code] = snap.data().data;
      state.lcs[code].meta = state.lcs[code].meta || {};
      state.lcs[code].meta.lc = code;
    } else if (!state.lcs[code]) {
      state.lcs[code] = DEFAULT_LC_DATA();
      state.lcs[code].meta.lc = code;
    }
  } catch (e) { console.error('lc load', code, e); }

  // 編集不可LC（閲覧）はライブ購読、編集可LCは購読しない（タイピングのclobber防止）
  if (_fbUnsub.viewLc) { _fbUnsub.viewLc(); _fbUnsub.viewLc = null; }
  if (subscribe) {
    _fbUnsub.viewLc = FS.lcRef(code).onSnapshot(snap => {
      if (code !== state.currentLC) return;
      if (snap.exists && snap.data().data) {
        _applyingRemote = true;
        state.lcs[code] = snap.data().data;
        state.lcs[code].meta = state.lcs[code].meta || {};
        state.lcs[code].meta.lc = code;
        renderPage();
        _applyingRemote = false;
      }
    });
  }
}

function fbQueueSave() {
  if (!fb.ready || !state.identity) return;
  if (_applyingRemote) return;
  clearTimeout(_fbWriteTimer);
  _fbWriteTimer = setTimeout(fbFlushSave, 600);
}
async function fbFlushSave() {
  if (!fb.ready || !state.identity) return;
  const ind = document.getElementById('saveIndicator');
  const email = state.identity.email || '';
  const tasks = [];
  // 自分の編集権限があるLCのみFRデータを書き込む（Rulesでもサーバー側強制）
  if (canEditCurrentLC() && state.lcs[state.currentLC]) {
    tasks.push(FS.lcRef(state.currentLC).set({
      data: state.lcs[state.currentLC],
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      updatedBy: email
    }, { merge: true }));
  }
  // 標準カタログはMCのみ
  if (isMC()) {
    tasks.push(FS.catalogRef().set({
      urls: state.globalCatalog || {},
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      updatedBy: email
    }, { merge: true }));
  }
  try {
    await Promise.all(tasks);
    if (ind) { ind.classList.remove('saving'); ind.textContent = 'クラウド保存済み'; }
  } catch (e) {
    console.error('fb save', e);
    if (ind) ind.textContent = '保存エラー(権限/通信)';
  }
}

/* ---------- Auth ---------- */
function startAuth() {
  ensureLoginLogo();
  if (!fb.ready) {
    // Firebase未設定 → ローカルモード（旧来のLC自己申告）
    loginShowStep('loginStep2');
    buildLoginLcOptions();
    document.getElementById('loginAccountFoot').innerHTML =
      '<span style="color:var(--aiesec-orange)">Firebase未設定のためローカルモードです（データは共有されません）</span>';
    document.getElementById('loginConfirmLC').onclick = () => {
      finishLocalLogin(document.getElementById('loginLcSelect').value);
    };
    return;
  }
  loginShowStep('loginStepAuth');
  loginError('');
  document.getElementById('googleLoginBtn').onclick = doGoogleSignIn;
  fb.auth.onAuthStateChanged(handleAuthState);
}

async function doGoogleSignIn() {
  loginError('');
  const provider = new firebase.auth.GoogleAuthProvider();
  provider.setCustomParameters({ hd: ALLOWED_EMAIL_DOMAIN, prompt: 'select_account' });
  try {
    await fb.auth.signInWithPopup(provider);
  } catch (e) {
    loginError('ログインに失敗しました: ' + (e.code || e.message));
  }
}

async function handleAuthState(user) {
  if (!user) { loginShowStep('loginStepAuth'); return; }
  const email = (user.email || '').toLowerCase();
  if (!email.endsWith('@' + ALLOWED_EMAIL_DOMAIN)) {
    await fb.auth.signOut();
    loginShowStep('loginStepAuth');
    loginError('@' + ALLOWED_EMAIL_DOMAIN + ' のアカウントのみ利用できます（' + email + ' は不可）。');
    return;
  }
  loginShowStep('loginStepLoading');
  try {
    // MC判定
    let role = 'LC';
    try {
      const adm = await FS.adminRef(email).get();
      if (adm.exists) role = 'MC';
    } catch (e) { console.warn('admin check', e); }

    // ユーザーのLC所属
    const uref = FS.userRef(user.uid);
    const usnap = await uref.get();
    let lc = usnap.exists ? (usnap.data().lc || null) : null;

    if (role !== 'MC' && (!lc || !LC_LIST.includes(lc))) {
      // LC未設定 → 選択させる
      state.identity = { role, lc: null, email, uid: user.uid };
      buildLoginLcOptions();
      document.getElementById('loginAccountFoot').innerHTML =
        'ログイン中: ' + escapeHtml(email) + ' ・ <a id="logoutLink">ログアウト</a>';
      const ll = document.getElementById('logoutLink');
      if (ll) ll.onclick = () => fb.auth.signOut();
      document.getElementById('loginConfirmLC').onclick = async () => {
        const sel = document.getElementById('loginLcSelect').value;
        await uref.set({ email, lc: sel, role, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
        state.identity.lc = sel;
        await enterApp();
      };
      loginShowStep('loginStep2');
      return;
    }

    // 既にLC確定 or MC
    if (role === 'MC' && !lc) lc = 'KO';
    await uref.set({ email, lc: lc || null, role, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
    state.identity = { role, lc: (role === 'MC' ? (lc || null) : lc), email, uid: user.uid };
    await enterApp();
  } catch (e) {
    console.error(e);
    loginError('読み込みに失敗しました: ' + (e.message || e));
    loginShowStep('loginStepAuth');
  }
}

// ローカルモード（Firebase未設定時）のログイン
function finishLocalLogin(lc) {
  state.identity = { role: 'LC', lc, email: '', uid: '' };
  state.currentLC = lc;
  if (!state.lcs[lc]) { state.lcs[lc] = DEFAULT_LC_DATA(); state.lcs[lc].meta.lc = lc; }
  saveState();
  hideLoginScreen();
  applyIdentity();
  renderLCSelector();
  renderSidebar();
  renderPage();
}

async function enterApp() {
  loginShowStep('loginStepLoading');
  // 表示開始LC: LCメンバーは自LC、MCは前回 or KO
  state.currentLC = (state.identity.role === 'LC')
    ? state.identity.lc
    : (state.currentLC && LC_LIST.includes(state.currentLC) ? state.currentLC : 'KO');

  await fbLoadGlobalCatalog();
  await fbLoadLC(state.currentLC, { subscribe: !canEditCurrentLC() });

  hideLoginScreen();
  applyIdentity();
  renderLCSelector();
  renderSidebar();
  renderPage();
  applyReadOnlyState();
}

/* ---------- LC切替時にFirestoreから読み込み ---------- */
const _origRenderLCSelector2 = renderLCSelector;
renderLCSelector = function() {
  _origRenderLCSelector2();
  const el = document.getElementById('lcSelect');
  if (!el) return;
  el.onchange = async () => {
    state.currentLC = el.value;
    if (fb.ready && state.identity && state.identity.email) {
      loginShowStep('loginStepLoading');
      await fbLoadLC(state.currentLC, { subscribe: !canEditCurrentLC() });
      hideLoginScreen();
    } else if (!state.lcs[state.currentLC]) {
      state.lcs[state.currentLC] = DEFAULT_LC_DATA();
      state.lcs[state.currentLC].meta.lc = state.currentLC;
    }
    saveState();
    renderPage();
    applyReadOnlyState();
  };
};

/* ---------- 編集不可LCを閲覧時は読み取り専用にする ---------- */
function applyReadOnlyState() {
  const root = document.getElementById('mainContent');
  if (!root) return;
  let banner = document.getElementById('roBanner');
  const editable = !fb.ready ? true : canEditCurrentLC();
  if (editable) {
    root.classList.remove('readonly-mode');
    if (banner) banner.remove();
    return;
  }
  root.classList.add('readonly-mode');
  root.querySelectorAll('input, textarea, select, button').forEach(el => {
    if (el.closest('#roBanner')) return;
    el.setAttribute('disabled', 'disabled');
  });
  if (!banner) {
    banner = document.createElement('div');
    banner.id = 'roBanner';
    banner.className = 'ro-banner';
    const main = document.querySelector('.main');
    if (main) main.insertBefore(banner, main.firstChild);
  }
  banner.innerHTML = '閲覧モード: ' + escapeHtml(state.currentLC) +
    ' は他LCのため編集できません。編集は所属LC (' +
    escapeHtml(state.identity && state.identity.lc || '-') + ') のメンバー、または MC のみ。';
}
// renderPage後に読み取り専用を再適用
const _origRenderPage2 = renderPage;
renderPage = function() {
  _origRenderPage2();
  applyReadOnlyState();
};

function applyIdentity() {
  const txt = document.getElementById('identityBadgeText');
  if (txt) txt.textContent = identityLabel();
}

document.getElementById('identityBadge').onclick = () => {
  if (fb.ready && fb.auth && fb.auth.currentUser) {
    if (confirm('ログアウトしますか？')) fb.auth.signOut();
  } else {
    if (confirm('ログイン情報を変更しますか？ (入力済みデータは保持されます)')) startAuth();
  }
};

/* =========================================================
   INIT
   ========================================================= */
loadState();          // localStorageキャッシュ（オフライン耐性）
applyIdentity();
renderLCSelector();
renderSidebar();
renderPage();

const _fbOk = initFirebase();
startAuth();           // Firebase ready→Google認証 / 未設定→ローカルモード

// funnelページ等の部分再描画でcard-headが作り直されても保存ボタンを必ず維持
const _mainContentEl = document.getElementById('mainContent');
let _injectScheduled = false;
const _cardBtnObserver = new MutationObserver(() => {
  if (_injectScheduled) return;
  _injectScheduled = true;
  requestAnimationFrame(() => {
    _injectScheduled = false;
    injectCardSaveButtons(_mainContentEl);
  });
});
_cardBtnObserver.observe(_mainContentEl, { childList: true, subtree: true });
</script>
